name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  privacy-check:
    name: Privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject privacy-sensitive paths
        run: bash scripts/check-privacy.sh

  swift-packages:
    name: swift test — ${{ matrix.package }}
    runs-on: macos-14
    strategy:
      matrix:
        package: [Core, Persistence]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
      - name: Show Swift version
        run: swift --version
      - name: Test
        run: swift test --package-path Packages/${{ matrix.package }}

  ios-build:
    name: Build iOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate xcodeproj
        run: |
          cd RememberMe
          xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project RememberMe/RememberMe.xcodeproj \
            -scheme RememberMe \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
