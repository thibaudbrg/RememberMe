excluded:
  - .build
  - DerivedData
  - sample-data
  - Packages/*/.build
  - "**/Generated"

disabled_rules:
  - todo
  - trailing_comma

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - operator_usage_whitespace
  - prefer_self_in_static_references
  - sorted_first_last
  - toggle_bool

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 60
  error: 120

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  excluded:
    - id
    - lat
    - lon
    - x
    - y
    - i
    - j
